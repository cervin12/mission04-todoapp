<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitaz Todo App (Beginner Friendly)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
        }
    </style>
</head>

<body style="max-width: 412px; background-color: #EEF0FF; margin: 0 auto; min-height: 100vh;" class="border">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-primary">
                    <i class="bi bi-check text-white" style="font-size: 24px;"></i>
                </span>
                <a class="navbar-brand fw-semibold" href="#">Mitaz</a>
            </div>

            <div class="d-flex align-items-center gap-2 fw-semibold">
                username
                <i class="bi bi-person-fill text-primary fs-1 fw-bold"></i>
            </div>
        </div>
    </nav>

    <div class="container my-4" role="group" aria-label="Basic radio toggle button group">
        <input type="radio" class="btn-check" name="btnradio" id="btnradio1" onchange="priorityFilter('all')" checked>
        <label class="btn btn-light me-2 rounded-pill btn-sm" for="btnradio1">All</label>

        <input type="radio" class="btn-check" name="btnradio" id="btnradio2" onchange="priorityFilter('high')">
        <label class="btn btn-light me-2 rounded-pill btn-sm" for="btnradio2">High</label>

        <input type="radio" class="btn-check" name="btnradio" id="btnradio3" onchange="priorityFilter('medium')">
        <label class="btn btn-light me-2 rounded-pill btn-sm" for="btnradio3">Medium</label>

        <input type="radio" class="btn-check" name="btnradio" id="btnradio4" onchange="priorityFilter('low')">
        <label class="btn btn-light me-2 rounded-pill btn-sm" for="btnradio4">Low</label>

        <input type="radio" class="btn-check" name="btnradio" id="btnradio5" onchange="showDone()">
        <label class="btn btn-light me-2 rounded-pill btn-sm" for="btnradio5">Done</label>
    </div>

    <div class="container">

        <div class="d-grid my-4">
            <button id="openCreateModalBtn" class="btn btn-primary d-flex align-items-center justify-content-center gap-1"
                type="button" data-bs-toggle="modal" data-bs-target="#newtaskmodal">
                <i class="bi bi-plus" style="font-size: 24px;"></i> Create Task
            </button>
        </div>

        <!-- Task Modal -->
        <div class="modal fade" id="newtaskmodal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="modalTitle">New Task</h1>
                        <!-- Added id="closeModalBtn" so we can easily trigger click on it to close modal -->
                        <button type="button" class="btn-close" id="closeModalBtn" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="taskForm">
                            <div class="mb-3">
                                <label for="taskTitle" class="form-label">Task Title</label>
                                <input type="text" class="form-control" id="taskTitle" required>
                            </div>
                            <div class="mb-3">
                                <label for="taskDueDate" class="form-label">Task Due Date</label>
                                <input type="date" class="form-control" id="taskDueDate">
                            </div>
                            <div class="mb-3">
                                <label for="taskDueTime" class="form-label">Task Due Time</label>
                                <input type="time" class="form-control" id="taskDueTime">
                            </div>
                            <div class="mb-3">
                                <label for="taskPriority" class="form-label">Task Priority</label>
                                <select class="form-select" id="taskPriority">
                                    <option value="high">High</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="low">Low</option>
                                </select>
                            </div>
                            <button id="create-task-button" class="btn btn-primary" type="submit">Save</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>

        <!-- Task List Container -->
        <div class="tasklist"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        
        let tasks = [];
        let editingTaskId = null;
        let currentFilter = 'all';

        
        function closeModal() {
            document.getElementById('closeModalBtn').click();
        }

        function renderTasks(taskList = tasks) {
            const list = document.querySelector('.tasklist');

            if (taskList.length === 0) {
                list.innerHTML = '<p class="text-center text-muted mt-3">No tasks found!</p>';
                return;
            }

            list.innerHTML = taskList.map(task => `
                <div class="card mb-2" id="card-${task.id}">
                    <div class="card-body">
                        <div class="d-flex align-items-baseline gap-2">
                            <input type="checkbox" class="form-check-input" id="check-${task.id}" 
                                onchange="markDone('${task.id}')" ${task.isdone ? 'checked' : ''}>
                            <label for="check-${task.id}" class="flex-grow-1 ${task.isdone ? 'text-decoration-line-through text-muted' : ''}">
                                ${task.title}
                            </label>
                            
                            <div class="d-flex gap-1">
                                <button class="btn btn-sm text-secondary" type="button" 
                                    data-bs-toggle="modal" data-bs-target="#newtaskmodal"
                                    onclick="openEditModal('${task.id}')">
                                    <i class="bi bi-pencil-square"></i>
                                </button>
                                <button class="btn btn-sm text-danger" type="button" onclick="deleteTask('${task.id}')">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                        
                        <span class="badge bg-secondary bg-opacity-10 fw-normal text-danger rounded-pill mt-2">
                            <i class="bi bi-clock text-danger me-2"></i>${task.date || 'Today'}, ${task.time || ''}
                        </span>
                        <span class="badge bg-primary bg-opacity-50 fw-medium rounded-pill text-capitalize">${task.priority || 'medium'}</span>
                    </div>
                </div>
            `).join('');
        }


        function openEditModal(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            editingTaskId = id;

            // Fill form with selected card
            document.getElementById('taskTitle').value = task.title;
            document.getElementById('taskDueDate').value = task.date || '';
            document.getElementById('taskDueTime').value = task.time || '';
            document.getElementById('taskPriority').value = task.priority || 'medium';

            // Change title
            document.getElementById('modalTitle').textContent = 'Edit Task';
        }

        // create new task
        document.getElementById('openCreateModalBtn').addEventListener('click', () => {
            editingTaskId = null;
            document.getElementById('taskForm').reset();
            document.getElementById('modalTitle').textContent = 'New Task';
        });

        // form submit
        document.getElementById('taskForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const title = document.getElementById('taskTitle').value.trim();
            const date = document.getElementById('taskDueDate').value;
            const time = document.getElementById('taskDueTime').value;
            const priority = document.getElementById('taskPriority').value;

            if (!title) return;

            if (editingTaskId) {
                // update task
                const task = tasks.find(t => t.id === editingTaskId);
                if (task) {
                    task.title = title;
                    task.date = date;
                    task.time = time;
                    task.priority = priority;
                }
                editingTaskId = null;
            } else {
                // create new task
                const newTask = {
                    id: 'task-' + Date.now(),
                    title: title,
                    date: date || 'Today',
                    time: time || '',
                    priority: priority || 'medium',
                    isdone: false
                };
                tasks.unshift(newTask);
            }

            applyCurrentFilter();

            document.getElementById('taskForm').reset();

            closeModal();
        });

        //delete task
        function deleteTask(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                tasks = tasks.filter(task => task.id !== id);
                applyCurrentFilter();
            }
        }

        // mark task as done/not done
        function markDone(id) {
            const task = tasks.find(task => task.id === id);
            if (!task) return;
            task.isdone = !task.isdone;
            applyCurrentFilter();
        }

        //filtering
        function applyCurrentFilter() {
            if (currentFilter === 'done') {
                const filteredTasks = tasks.filter(task => task.isdone === true);
                renderTasks(filteredTasks);
            } else if (currentFilter === 'all') {
                renderTasks(tasks);
            } else {
                const filteredTasks = tasks.filter(task => task.priority === currentFilter);
                renderTasks(filteredTasks);
            }
        }

        function showDone() {
            currentFilter = 'done';
            applyCurrentFilter();
        }

        function priorityFilter(level) {
            currentFilter = level;
            applyCurrentFilter();
        }

        // load data from data.json
        async function loadTasks() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) {
                    throw new Error(`Failed to load data.json (status: ${response.status})`);
                }
                tasks = await response.json();
                renderTasks();
            } catch (error) {
                console.error('Error fetching data.json:', error);
            }
        }

        // load data
        loadTasks();
    </script>
</body>

</html>
